<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Graphtrack — Phase 0 spike</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --canvas:#0a0a0a; --card:#1a1a1a; --yellow:#faff69; --body:#cccccc; --muted:#888888;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family: Inter, system-ui, sans-serif; background:var(--canvas); color:var(--body); display:flex; flex-direction:column; }
  header { padding:16px 24px; border-bottom:1px solid #2a2a2a; display:flex; align-items:center; gap:16px; flex: 0 0 auto; }
  header h1 { font-size:18px; margin:0; color:#fff; letter-spacing:-0.5px; }
  header span.y { color:var(--yellow); }
  .toggle { margin-left:auto; display:flex; gap:8px; }
  .toggle button {
    background:var(--card); color:var(--body); border:1px solid #3a3a3a;
    padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px;
  }
  .toggle button.active { background:var(--yellow); color:#0a0a0a; border-color:var(--yellow); font-weight:600; }
  #stats { flex: 0 0 auto; padding:12px 24px; display:flex; gap:24px; flex-wrap:wrap; font-size:13px; border-bottom:1px solid #2a2a2a; }
  #stats b { color:#fff; }
  #graph {
    flex: 1 1 auto; min-height:0; width:100%;
    /* background grid — subtle hairlines on deep black canvas */
    background-color: var(--canvas);
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 42px 42px;
    position: relative;
  }
  #graph::after {
    /* soft static radial glow behind the action */
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(255,250,105,0.04) 0%, transparent 55%);
  }
  #graph canvas { position: relative; z-index: 2; }
  #glow {
    /* Cursor-following spotlight: a FIXED full-screen overlay whose radial
       gradient center is driven by CSS variables --gx/--gy set to the cursor's
       viewport coords on mousemove. No absolute positioning over the canvas,
       no blend/filter, no container-rect math — renders identically in any
       Chromium (Claude webview, Chrome, Edge). pointer-events:none lets all
       graph interaction pass through. */
    position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background: radial-gradient(circle 340px at var(--gx, -9999px) var(--gy, -9999px),
      rgba(255,250,105,0.26),
      rgba(255,250,105,0.07) 45%,
      transparent 72%);
    opacity: 0;
  }
  #glow.on { opacity: 1; }
</style>
</head>
<body>
  <header>
    <h1>Graphtrack <span class="y">▪</span> Phase 0 spike</h1>
    <div class="toggle">
      <button id="btnAgg" class="active">Aggregate (hub &amp; tools)</button>
      <button id="btnChain">Chronological (turns &rarr; tools)</button>
    </div>
  </header>
  <div id="stats">
    <span>Model <b id="sModel">–</b></span>
    <span>Turns <b id="sTurns">–</b></span>
    <span>Tool calls <b id="sCalls">–</b></span>
    <span>Total <b id="sTotal">–</b></span>
    <span>Input <b id="sIn">–</b></span>
    <span>Output <b id="sOut">–</b></span>
    <span>Cache read <b id="sRead">–</b></span>
    <span>Cache write <b id="sWrite">–</b></span>
  </div>
  <div id="graph"></div>
  <div id="glow"></div>
  <script src="graph-data.js"></script>
  <script>
    const D = window.GRAPHTRACK_DATA;
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : n;

    // Fill stats
    const s = D.session;
    $("sModel").textContent = s.model;
    $("sTurns").textContent = s.turns;
    $("sCalls").textContent = s.toolCalls;
    $("sTotal").textContent = fmt(s.totalTokens);
    $("sIn").textContent = fmt(s.totalInput);
    $("sOut").textContent = fmt(s.totalOutput);
    $("sRead").textContent = fmt(s.totalCacheRead);
    $("sWrite").textContent = fmt(s.totalCacheWrite);

    const container = $("graph");
    const glow = document.getElementById("glow");
    const root = document.documentElement;
    container.addEventListener("mousemove", (e) => {
      root.style.setProperty("--gx", e.clientX + "px");
      root.style.setProperty("--gy", e.clientY + "px");
      glow.classList.add("on");
    });
    container.addEventListener("mouseleave", () => glow.classList.remove("on"));
    const options = {
      physics: { enabled: true, solver: "forceAtlas2Based", stabilization: { iterations: 200 } },
      interaction: { hover: true, tooltipDelay: 200 },
      nodes: { shape: "dot", font: { color: "#cccccc", size: 13 }, widthConstraint: { maximum: 140 } },
      edges: { color: { color: "#3a3a3a", highlight: "#faff69" }, smooth: { enabled: true, type: "dynamic" } },
    };
    let network = null;
    function render(data) {
      if (network) network.destroy();
      network = new vis.Network(container, { nodes: new vis.DataSet(data.nodes), edges: new vis.DataSet(data.edges) }, options);
    }
    render(D.aggregate);
    $("btnAgg").addEventListener("click", () => { setActive("btnAgg"); render(D.aggregate); });
    $("btnChain").addEventListener("click", () => { setActive("btnChain"); render(D.chronological); });
    function setActive(id) { $("btnAgg").classList.toggle("active", id==="btnAgg"); $("btnChain").classList.toggle("active", id==="btnChain"); }
  </script>
</body>
</html>
